backend:
  name: git-gateway
  branch: main

# Langue de l'interface d'administration
locale: fr

# Où les médias sont enregistrés (photos, logo…)
media_folder: "assets"
public_folder: "/assets"

publish_mode: simple

collections:
  # ====================== FERMETURES / CONGÉS ======================
  - name: "absences"
    label: "Fermetures et congés"
    label_singular: "Fermeture"
    description: >-
      Déclarez ici les périodes de fermeture. Le site affichera
      automatiquement un bandeau pendant la période indiquée et
      désactivera le bouton de commande.
    folder: "content/absences"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    identifier_field: "message"
    summary: "{{fields.debut}} → {{fields.fin}} — {{fields.message}}"
    sortable_fields: ["debut", "fin"]
    fields:
      - label: "Date de début"
        name: "debut"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        picker_utc: true
        hint: "Premier jour de fermeture, inclus."
        required: true

      - label: "Date de fin"
        name: "fin"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        picker_utc: true
        hint: "Dernier jour de fermeture, inclus. Réouverture le lendemain."
        required: true

      - label: "Titre court"
        name: "message"
        widget: "string"
        default: "Fermeture exceptionnelle"
        hint: "Affiché en gras dans le bandeau rouge. Exemple : Congés annuels."
        required: true

      - label: "Message détaillé"
        name: "detail"
        widget: "text"
        default: "Nous sommes fermés pendant cette période."
        hint: "Une ou deux phrases. Le site ajoute automatiquement la date de réouverture."
        required: false

      - label: "Bloquer la commande"
        name: "cible"
        widget: "select"
        default: "site"
        options:
          - label: "Oui — fermeture complète (bandeau + commande désactivée)"
            value: "site"
          - label: "Non — information seulement (la commande reste possible)"
            value: "tel"
        hint: >-
          Choisissez « Oui » pour des congés. Choisissez « Non » pour
          signaler une ouverture retardée sans empêcher de commander.

  # ====================== INFORMATIONS DU SITE ======================
  - name: "reglages"
    label: "Coordonnées et horaires"
    files:
      - name: "infos"
        label: "Téléphone, horaires, note Google"
        file: "content/reglages.json"
        fields:
          - label: "Téléphone affiché"
            name: "telephone"
            widget: "string"
            default: "05 56 37 09 76"

          - label: "Numéro pour le bouton d'appel"
            name: "telephone_lien"
            widget: "string"
            default: "+33556370976"
            hint: "Format international, sans espaces ni tirets. Sert au bouton « Appeler »."

          - label: "Note Google"
            name: "note"
            widget: "string"
            default: "4.6"

          - label: "Nombre d'avis Google"
            name: "nb_avis"
            widget: "string"
            default: "129"

          - label: "Horaires — lundi"
            name: "lundi"
            widget: "string"
            default: "Fermé"
            required: false

          - label: "Horaires — mardi"
            name: "mardi"
            widget: "string"
            default: "11:00–13:30 · 18:30–21:30"
            required: false

          - label: "Horaires — mercredi"
            name: "mercredi"
            widget: "string"
            default: "11:00–13:30 · 18:30–21:30"
            required: false

          - label: "Horaires — jeudi"
            name: "jeudi"
            widget: "string"
            default: "11:00–13:30 · 18:30–21:30"
            required: false

          - label: "Horaires — vendredi"
            name: "vendredi"
            widget: "string"
            default: "11:00–13:30 · 18:30–21:30"
            required: false

          - label: "Horaires — samedi"
            name: "samedi"
            widget: "string"
            default: "11:00–13:30 · 18:30–21:30"
            required: false

          - label: "Horaires — dimanche"
            name: "dimanche"
            widget: "string"
            default: "18:30–21:30"
            required: false
